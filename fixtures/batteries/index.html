<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeaflaskAssistant — batteries bench</title>
    <!-- The package sheet first, host styles after — the careless-host
         loading order, same stance as the other benches. -->
    <link rel="stylesheet" href="../../dist/styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #eef1f5;
        color: #22262b;
        line-height: 1.5;
      }
      main {
        max-width: 44rem;
        padding: 2rem;
      }
      fieldset {
        border: 1px solid #b8c0cc;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem 1rem;
      }
      legend {
        font-weight: bold;
        padding: 0 0.375rem;
      }
      button {
        margin: 0.2rem 0.25rem 0 0;
        font: inherit;
        padding: 0.25rem 0.6rem;
      }
      input,
      textarea,
      [contenteditable] {
        display: block;
        width: 100%;
        margin: 0.4rem 0;
        padding: 0.3rem 0.5rem;
        font: inherit;
        border: 1px solid #b8c0cc;
        background: #fff;
      }
      [contenteditable] {
        min-height: 2.2rem;
      }
      .host-palette {
        border: 2px dashed #7a4bd0;
        background: #f4efff;
        padding: 0.5rem 0.75rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./out/main.js"></script>
  </body>
</html>
