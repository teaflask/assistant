<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcript — renderer showcase</title>
    <!-- The package sheet first, the host's styles after it and unlayered —
         the loading order a careless host produces. -->
    <link rel="stylesheet" href="/dist/styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f2ea;
        color: #2b2b2b;
        line-height: 1.5;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }
      .bench-controls {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      .bench-surface {
        border: 1px dashed #b9b1a0;
      }
      /* Gallery scaffolding the package sheet deliberately does not emit
         (its @source scans src/components only — fixture-only utility
         classes never ride the customer stylesheet). */
      .bench-gallery {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }
      .bench-slot {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .bench-specimen {
        border-style: dashed;
      }
      .bench-scrollback {
        height: 12rem;
      }
      .bench-scroll-button {
        position: absolute;
        inset-inline: 0;
        bottom: 0.5rem;
        display: flex;
        justify-content: center;
      }
      /* The full-flow slot: tall enough that the whole canned
         conversation is visible for the screenshot baseline. */
      .bench-transcript-flow {
        height: 60rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Transcript renderer showcase</h1>
      <p>
        Every renderer slot in the adopted register (assistant-ui, bake-off
        2026-07-30) over canned content, on the package's tokens. No backend,
        fully deterministic.
      </p>
      <div id="root"></div>
    </main>
    <script type="module" src="/fixtures/transcript/out/main.js"></script>
  </body>
</html>
