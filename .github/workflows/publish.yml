name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm ci, the test suite, tsc + Tailwind and the pack check. Unmeasured
    # backstop against a wedged runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # First, before anything is installed or built: a tag that does not
      # name the version in package.json fails here in seconds. jq is on
      # the runner image; nothing before this step needs node_modules.
      - name: The tag names the package version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm publish
